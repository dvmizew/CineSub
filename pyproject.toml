[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cinesub"
version = "0.2.0"
description = "Automated subtitle searching, downloading, and audio-based synchronization CLI"
readme = "README.md"
authors = [
    { name = "Daniel Radu" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["subtitles", "srt", "ffsubsync", "opensubtitles", "subdl", "movies", "tv-shows", "sync", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "cyclopts>=4.0.0",
    "httpx[http2]>=0.27.0",
    "orjson>=3.9.0",
    "rich>=13.7.0",
    "guessit>=3.8.0",
    "babelfish>=0.6.0",
    "rapidfuzz>=3.0.0",
    "python-dotenv>=1.0.0",
    "charset-normalizer>=3.3.0",
    "srt>=3.5.3",
]

[project.optional-dependencies]
sync = [
    "ffsubsync>=0.4.25",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
cinesub = "cinesub.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
ignore_missing_imports = true
